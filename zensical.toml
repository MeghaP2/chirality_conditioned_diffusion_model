[project]
site_name = "chirality_aware_conformer_generation"
site_url = "https://MeghaP2.github.io/chirality_aware_conformer_generation/"
repo_url = "https://github.com/MeghaP2/chirality_aware_conformer_generation"
repo_name = "MeghaP2/chirality_aware_conformer_generation"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "API Reference" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
